# Final layer: production consumes immutable versioned application images.
# GitHub Actions builds both immutable images; VM09 only pulls and reconciles changed services.
services:
  setup:
    image: livingruntime-app:${LRSITE_APP_RELEASE:-${LRSITE_RELEASE:?Set LRSITE_RELEASE}}
  api:
    image: livingruntime-app:${LRSITE_APP_RELEASE:-${LRSITE_RELEASE:?Set LRSITE_RELEASE}}
  worker:
    image: livingruntime-app:${LRSITE_APP_RELEASE:-${LRSITE_RELEASE:?Set LRSITE_RELEASE}}
  web:
    image: livingruntime-app:${LRSITE_APP_RELEASE:-${LRSITE_RELEASE:?Set LRSITE_RELEASE}}
  knowledge:
    image: livingruntime-knowledge:${LRSITE_KNOWLEDGE_RELEASE:-${LRSITE_RELEASE:?Set LRSITE_RELEASE}}
