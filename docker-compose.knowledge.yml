# Optional mature temporal knowledge graph. Does not start during normal AIHot deploy.
# Start only after NVIDIA structured-output compatibility has been verified.
services:
  knowledge-neo4j:
    image: neo4j:5.26.2
    profiles: [knowledge]
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - knowledge_neo4j:/data
    healthcheck:
      test: ["CMD-SHELL","wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 15
  knowledge:
    profiles: [knowledge]
    build:
      context: .
      dockerfile: knowledge_service/Dockerfile
    restart: unless-stopped
    environment:
      NEO4J_URI: bolt://knowledge-neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      # Existing deployment LLM credentials are used for Graphiti extraction.
      # Dedicated GRAPHITI_LLM_* values may override these independently.
      GRAPHITI_LLM_API_KEY: ${GRAPHITI_LLM_API_KEY:-${LLM_API_KEY:-}}
      GRAPHITI_LLM_BASE_URL: ${GRAPHITI_LLM_BASE_URL:-${LLM_BASE_URL:-}}
      GRAPHITI_LLM_MODEL: ${GRAPHITI_LLM_MODEL:-}
      GRAPHITI_EMBEDDING_MODEL: ${GRAPHITI_EMBEDDING_MODEL:-nvidia/nemotron-3-embed-1b}
      GRAPHITI_EMBEDDING_DIM: ${GRAPHITI_EMBEDDING_DIM:-2048}
    depends_on:
      knowledge-neo4j:
        condition: service_healthy
    mem_limit: 900m
    cpus: 1.0
    # Accessible only inside Compose network: no public listener.
volumes:
  knowledge_neo4j: {}
