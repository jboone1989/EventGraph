# Optional mature temporal knowledge graph. Does not start during normal AIHot deploy.
# Run with a private authenticated model proxy backed by EventGraph model bindings.
services:
  knowledge-neo4j:
    image: neo4j:5.26.2
    profiles: [knowledge]
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - knowledge_neo4j:/data
    healthcheck:
      test: ["CMD-SHELL","wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 15
  knowledge:
    profiles: [knowledge]
    build:
      context: .
      dockerfile: knowledge_service/Dockerfile
    restart: unless-stopped
    environment:
      NEO4J_URI: bolt://knowledge-neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      GRAPHITI_MODEL_PROXY_URL: http://api:3001/api/internal/graphiti/v1
      GRAPHITI_MODEL_PROXY_TOKEN: ${GRAPHITI_MODEL_PROXY_TOKEN:?Configure shared Graphiti model proxy token in production env}
      GRAPHITI_EMBEDDING_DIM: ${GRAPHITI_EMBEDDING_DIM:-2048}
    depends_on:
      knowledge-neo4j:
        condition: service_healthy
    mem_limit: 900m
    cpus: 1.0
    # Accessible only inside Compose network: no public listener.
volumes:
  knowledge_neo4j: {}
