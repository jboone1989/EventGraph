# VM13: develop Web/API using the existing production database over a private tunnel.
# Administrative writes intentionally affect production data. No worker or database
# runs on VM13, and preview deploys do not run migrations or seeds.
# devdb is only the VM13 gateway alias to the production DB tunnel.
# Configuration: docs/vm13-preview.md.
name: eventgraph-vm13-preview
services:
  api:
    image: ${EVENTGRAPH_APP_IMAGE:?Immutable GHCR image digest required}
    command: ["node", "apps/api/src/main.ts"]
    restart: unless-stopped
    env_file: ./vm13.env
    extra_hosts:
      # The tunnel binds the forwarded port on the docker bridge gateway, not 0.0.0.0.
      - "devdb:host-gateway"
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "3001"
      # VM13 has no worker: allow only explicitly triggered admin model probes.
      MODEL_CALLS_ENABLED: "true"
      AIHOT_DATA_DIR: /data
      AIHOT_RELEASE: ${EVENTGRAPH_PREVIEW_RELEASE:?Source commit required}
      EVENTGRAPH_PREVIEW_READONLY: "false"
      EVENTGRAPH_PREVIEW_MODE: "true"
    volumes:
      - data:/data
    mem_limit: 768m
    cpus: 0.75
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    image: ${EVENTGRAPH_APP_IMAGE:?Immutable GHCR image digest required}
    command: ["node", "apps/web/server.ts"]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.50
    environment:
      NODE_ENV: production
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "3000"
      API_BASE_URL: "http://api:3001"
      SITE_URL: "http://43.133.185.154"
      TRUST_PROXY: "false"
      AIHOT_RELEASE: "${EVENTGRAPH_PREVIEW_RELEASE:?Source commit required}"
    ports:
      - "80:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  data: {}
