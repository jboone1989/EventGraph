# VM13 is a single-user DEVELOPMENT PREVIEW, not production.
# Only the Web/SSR process runs here. API, database, worker, Neo4j,
# ingestion and model calls remain on cn-dev (43.142.127.40).
# Deploy: sudo docker compose -f docker-compose.vm13-preview.yml up -d --no-build --pull never
name: eventgraph-vm13-preview
services:
  web:
    image: ghcr.io/jboone1989/eventgraph-app@sha256:3e49688ddae5428028d598c11217a40ff8afd0c60d194ce046cbc1413ac2d2c7
    command: ["node", "apps/web/server.ts"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "3000"
      API_BASE_URL: "http://43.142.127.40"
      SITE_URL: "http://43.133.185.154"
      TRUST_PROXY: "false"
      AIHOT_RELEASE: "11478d2a9201f11094b97d5234bd882aaa54a246"
    ports:
      - "80:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
