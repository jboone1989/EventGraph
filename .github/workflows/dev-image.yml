# Native GitHub event -> Docker official actions -> GHCR -> optional dev rollout.
# Production is deliberately out of scope.
name: Build Dev Image

on:
  workflow_run:
    workflows: ["Check"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: eventgraph-dev-pipeline
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.ref.outputs.image_ref }}
      source_sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout passing main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Confirm this is still main HEAD
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [[ "$current" == "$SOURCE_SHA" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::A newer main commit exists; skip obsolete image.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.current.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.current.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.current.outputs.publish == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jboone1989/eventgraph-app:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=eventgraph-app
          cache-to: type=gha,mode=max,scope=eventgraph-app

      - name: Export immutable image ref
        if: steps.current.outputs.publish == 'true'
        id: ref
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image_ref=ghcr.io/jboone1989/eventgraph-app@$DIGEST" >> "$GITHUB_OUTPUT"

  deploy_dev:
    # Deployment is opt-in: never overwrite cn-dev before the existing dirty
    # worktree and mixed Compose stack have been reconciled.
    needs: publish
    if: >-
      ${{ needs.publish.outputs.image_ref != '' &&
          vars.EVENTGRAPH_DEV_AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout deployment Compose overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.source_sha }}
          persist-credentials: false

      - name: Deploy image to cn-dev (no build, no volumes, no migrations)
        env:
          SSH_KEY: ${{ secrets.EVENTGRAPH_DEV_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVENTGRAPH_DEV_KNOWN_HOSTS }}
          DEV_HOST: ${{ vars.EVENTGRAPH_DEV_HOST }}
          DEV_USER: ${{ vars.EVENTGRAPH_DEV_USER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
          SOURCE_SHA: ${{ needs.publish.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          [[ -n "$SSH_KEY" && -n "$SSH_KNOWN_HOSTS" && -n "$DEV_HOST" && -n "$DEV_USER" ]]
          [[ "$IMAGE_REF" =~ ^ghcr\.io/jboone1989/eventgraph-app@sha256:[a-f0-9]{64}$ ]]
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [[ "$current" == "$SOURCE_SHA" ]] || { echo '::notice::Obsolete release skipped'; exit 0; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          target="$DEV_USER@$DEV_HOST"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" \
            'install -d -m 700 "$HOME/.eventgraph-ci"'
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            docker-compose.dev-image.yml "$target:~/.eventgraph-ci/dev-image.yml"
          printf '%s' "$GH_TOKEN" | ssh -o BatchMode=yes "$target" \
            "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          trap 'ssh -o BatchMode=yes "$target" "docker logout ghcr.io" >/dev/null 2>&1 || true' EXIT
          ssh -o BatchMode=yes "$target" \
            "cd /home/ubuntu/livingruntime-aihot && \
             export EVENTGRAPH_APP_IMAGE='$IMAGE_REF' && \
             docker compose -f docker-compose.yml -f /home/ubuntu/.eventgraph-ci/dev-image.yml pull api worker web && \
             docker compose -f docker-compose.yml -f /home/ubuntu/.eventgraph-ci/dev-image.yml \
               up -d --no-deps --no-build --pull never api worker web && \
             docker compose -f docker-compose.yml -f /home/ubuntu/.eventgraph-ci/dev-image.yml \
               exec -T web node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
