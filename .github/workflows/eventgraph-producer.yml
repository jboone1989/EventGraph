name: EventGraph GH-AW Work Intake

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  actions: write
  issues: read
  pull-requests: read

concurrency:
  group: eventgraph-work-intake
  cancel-in-progress: false

jobs:
  submit:
    if: github.event.label.name == 'agent-ready' && github.actor == 'jboone1989' && vars.EVENTGRAPH_GH_AW_QUEUE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout approved intake script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned native GH-AW CLI
        uses: github/gh-aw/actions/setup-cli@0627fdbe4beb5f3b71aa569f8d97150b87f2111a # v1.0.1
        with:
          version: v1.0.1
      - name: Validate intake contract and submit native Work
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo '::error::Set repository secret GH_AW_GITHUB_TOKEN to a fine-grained user PAT before enabling intake'; exit 1; }
          node --test scripts/ci/eventgraph-work-intake.test.mjs
          node scripts/ci/eventgraph-work-intake.mjs
