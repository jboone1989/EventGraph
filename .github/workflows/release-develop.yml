# Reusable only; a successful exact-SHA Check invokes this, not workflow_run.
name: "开发发布 · GHCR 镜像与 VM13 预览"
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact immutable develop HEAD to publish, after passing Check and E2E
        required: true
        type: string
permissions:
  contents: read
  packages: write
  checks: read
jobs:
  publish:
    name: publish # 发布验证成功的 GHCR 镜像；供生产发布核验
    if: ${{ inputs.source_sha == github.sha && github.ref_name == 'develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      checks: read
    outputs:
      image_ref: ${{ steps.ref.outputs.image_ref }}
      source_sha: ${{ github.sha }}
    steps:
      - name: Checkout passing SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify manual publish requires previously successful checks
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == develop && "$SOURCE_SHA" == "$GITHUB_SHA" ]] ||
            { echo '::error::Manual publish must pin current develop HEAD'; exit 1; }
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/develop" --jq '.commit.sha')"
          [[ "$current" == "$SOURCE_SHA" ]] ||
            { echo '::error::Develop moved; publish the new HEAD instead'; exit 1; }
          checks="$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/check-runs?per_page=100")"
          for required in check e2e; do
            jq -s -e --arg required "$required" '
              [.[].check_runs[]? | select(.name == $required and .conclusion == "success")] | length > 0
            ' <<< "$checks" >/dev/null || {
              echo "::error::No successful $required check for exact source SHA"; exit 1;
            }
          done
          echo "Manual publish authorized by exact SHA checks: $SOURCE_SHA"

      - name: Skip superseded commits
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_BRANCH" == develop || "$SOURCE_BRANCH" == main ]]
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/$SOURCE_BRANCH" --jq '.commit.sha')"
          if [[ "$current" != "$SOURCE_SHA" ]]; then
            if [[ "$(git rev-parse --is-shallow-repository)" == true ]]; then
              git fetch --unshallow origin "$current"
            else
              git fetch origin "$current"
            fi
          fi
          # Supersession by content (specs/010): a documentation-only tip does not
          # suppress this pending code release; any later executable change does.
          # The release's own checkout decides and fails closed on any error.
          release="$(SOURCE_SHA="$SOURCE_SHA" HEAD_SHA="$current" \
            node scripts/ci/release-candidate.mjs | sed -n 's/^current=//p' | head -n1)"
          if [[ "$release" == true ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::A newer executable commit exists; skip obsolete build'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.current.outputs.publish == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: steps.current.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        if: steps.current.outputs.publish == 'true'
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jboone1989/eventgraph-app:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VITE_GISCUS_CATEGORY_ID=${{ vars.EVENTGRAPH_GISCUS_CATEGORY_ID }}
          cache-from: type=gha,scope=eventgraph-app
          cache-to: type=gha,mode=max,scope=eventgraph-app

      - name: Export immutable digest
        if: steps.current.outputs.publish == 'true'
        id: ref
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image_ref=ghcr.io/jboone1989/eventgraph-app@$DIGEST" >> "$GITHUB_OUTPUT"

      # The source checks do not cover the separately built GHCR digest.
      - name: Node for published-image smoke check
        if: steps.current.outputs.publish == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Smoke-test published digest with Compose (no rebuild)
        if: steps.current.outputs.publish == 'true'
        timeout-minutes: 12
        env:
          EVENTGRAPH_APP_IMAGE: ${{ steps.ref.outputs.image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EVENTGRAPH_APP_IMAGE" =~ ^ghcr\.io/jboone1989/eventgraph-app@sha256:[a-f0-9]{64}$ ]]
          node scripts/init-env.ts --llm-key ci-not-a-real-key
          sed -i 's/^COLLECT_ENABLED=.*/COLLECT_ENABLED=false/; s/^MODEL_CALLS_ENABLED=.*/MODEL_CALLS_ENABLED=false/' .env
          grep -qx 'COLLECT_ENABLED=false' .env
          grep -qx 'MODEL_CALLS_ENABLED=false' .env
          echo "MCP_ALLOWED_HOSTS=web" >> .env
          cat > "$RUNNER_TEMP/ci-published-image.yml" <<'COMPOSE'
          services:
            setup:
              image: ${EVENTGRAPH_APP_IMAGE:?}
            api:
              image: ${EVENTGRAPH_APP_IMAGE:?}
            worker:
              image: ${EVENTGRAPH_APP_IMAGE:?}
            web:
              image: ${EVENTGRAPH_APP_IMAGE:?}
          COMPOSE
          docker pull "$EVENTGRAPH_APP_IMAGE"
          # --pull never applies to the PostgreSQL dependency too; preload its official image.
          docker pull postgres:17-alpine
          docker compose -f docker-compose.yml -f "$RUNNER_TEMP/ci-published-image.yml" config --quiet
          docker compose -f docker-compose.yml -f "$RUNNER_TEMP/ci-published-image.yml" up -d --no-build --pull never
          healthy=0
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/api/health 2>/dev/null; then healthy=1; break; fi
            sleep 2
          done
          if [[ "$healthy" -ne 1 ]]; then
            echo '::error::Published image failed HTTP health check' >&2
            exit 1
          fi
          docker compose -f docker-compose.yml -f "$RUNNER_TEMP/ci-published-image.yml" ps
          docker compose -f docker-compose.yml -f "$RUNNER_TEMP/ci-published-image.yml" run --rm --no-deps --entrypoint node setup scripts/smoke.ts --base http://web:3000
          docker compose -f docker-compose.yml -f "$RUNNER_TEMP/ci-published-image.yml" exec -T db psql -U aihot -d aihot -Atc "select count(*) from sources" | grep -qx "$(node -p "require('./industry/sources.json').sources.length")"

      - name: Published-image smoke logs
        if: ${{ failure() && steps.current.outputs.publish == 'true' }}
        env:
          EVENTGRAPH_APP_IMAGE: ${{ steps.ref.outputs.image_ref }}
        run: |
          if test -f "$RUNNER_TEMP/ci-published-image.yml"; then
            docker compose -f docker-compose.yml -f "$RUNNER_TEMP/ci-published-image.yml" logs --tail 80
          fi

      - name: Clean published-image smoke environment
        if: ${{ always() && steps.current.outputs.publish == 'true' }}
        env:
          EVENTGRAPH_APP_IMAGE: ${{ steps.ref.outputs.image_ref }}
        run: |
          if test -f "$RUNNER_TEMP/ci-published-image.yml"; then
            docker compose -f docker-compose.yml -f "$RUNNER_TEMP/ci-published-image.yml" down -v
          fi

  deploy_vm13_preview:
    name: "部署 VM13 开发预览"
    needs: publish
    if: ${{ needs.publish.outputs.image_ref != '' && vars.EVENTGRAPH_DEV_AUTO_DEPLOY == 'true' }}
    concurrency:
      group: eventgraph-vm13-preview
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    permissions:
      contents: read
      packages: read
    outputs:
      deployed: ${{ steps.current.outputs.deploy }}
      release: ${{ needs.publish.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.source_sha }}
          persist-credentials: false
      - name: Skip superseded release
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.publish.outputs.source_sha }}
        shell: bash
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/develop" --jq '.commit.sha' || true)"
          if [[ -n "$current" && "$current" != "$SOURCE_SHA" ]]; then
            if [[ "$(git rev-parse --is-shallow-repository)" == true ]]; then
              git fetch --unshallow origin "$current" || true
            else
              git fetch origin "$current" || true
            fi
          fi
          # Same content-based supersession as publish (specs/010): deploy the
          # published release unless a later executable change exists; fail
          # closed — an unreadable branch tip skips the deployment.
          release="$({ SOURCE_SHA="$SOURCE_SHA" HEAD_SHA="$current" node scripts/ci/release-candidate.mjs || true; } \
            | sed -n 's/^current=//p' | head -n1)"
          if [[ "$release" == true ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo '::notice::A newer executable or unreadable branch tip; skip release'
          fi
      - name: Deploy VM13 Web and API from immutable digest
        if: steps.current.outputs.deploy == 'true'
        shell: bash
        timeout-minutes: 13
        env:
          EVENTGRAPH_IMAGE: ${{ needs.publish.outputs.image_ref }}
          EVENTGRAPH_PREVIEW_RELEASE: ${{ needs.publish.outputs.source_sha }}
          EVENTGRAPH_PROD_TUNNEL_HOST_FINGERPRINT: ${{ secrets.EVENTGRAPH_PROD_SSH_FINGERPRINT }}
          EVENTGRAPH_DEV_SSH_KEY: ${{ secrets.EVENTGRAPH_DEV_SSH_KEY }}
        run: |
          set -euo pipefail
          # The hosted runner already includes OpenSSH. Do not download drone-ssh at runtime.
          [[ "$EVENTGRAPH_IMAGE" =~ ^ghcr[.]io/jboone1989/eventgraph-app@sha256:[a-f0-9]{64}$ ]] || { echo '::error::Invalid immutable image'; exit 1; }
          [[ "$EVENTGRAPH_PREVIEW_RELEASE" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::Invalid exact release SHA'; exit 1; }
          [[ "$EVENTGRAPH_PROD_TUNNEL_HOST_FINGERPRINT" =~ ^SHA256:[a-zA-Z0-9+/=]+$ ]] || { echo '::error::Missing/invalid production tunnel fingerprint'; exit 1; }
          [[ -n "${EVENTGRAPH_DEV_SSH_KEY:-}" ]] || { echo '::error::Missing VM13 deployment key'; exit 1; }
          for program in ssh ssh-keyscan ssh-keygen; do command -v "$program" >/dev/null || { echo "::error::Missing OpenSSH tool: $program"; exit 1; }; done
          umask 077
          key_file="$(mktemp "${RUNNER_TEMP}/vm13-ssh-key.XXXXXXXX")"
          known_hosts="$(mktemp "${RUNNER_TEMP}/vm13-known-hosts.XXXXXXXX")"
          scanned="$(mktemp "${RUNNER_TEMP}/vm13-host-scan.XXXXXXXX")"
          candidate="$(mktemp "${RUNNER_TEMP}/vm13-host-candidate.XXXXXXXX")"
          trap 'rm -f "$key_file" "$known_hosts" "$scanned" "$candidate"' EXIT
          printf '%s\n' "$EVENTGRAPH_DEV_SSH_KEY" > "$key_file"
          chmod 600 "$key_file" "$known_hosts"
          ssh-keygen -y -P '' -f "$key_file" >/dev/null 2>&1 || { echo '::error::Invalid VM13 SSH private key'; exit 1; }
          host=43.133.185.154
          fingerprint=SHA256:950EdynTTleTOtbmusu5UrYvSQwgsl4hX3/frQniLh4
          found=false
          for attempt in 1 2 3; do
            ssh-keyscan -T 10 -t rsa,ed25519,ecdsa "$host" 2>/dev/null > "$scanned" || true
            while IFS= read -r entry; do
              [[ "$entry" == "$host "* ]] || continue
              printf '%s\n' "$entry" > "$candidate"
              observed="$(ssh-keygen -lf "$candidate" 2>/dev/null | awk '{print $2}')"
              if [[ "$observed" == "$fingerprint" ]]; then
                printf '%s\n' "$entry" > "$known_hosts"
                found=true
                break
              fi
            done < "$scanned"
            [[ "$found" == true ]] && break
            [[ "$attempt" == 3 ]] || sleep 5
          done
          [[ "$found" == true && -s "$known_hosts" ]] || { echo '::error::VM13 host key does not match pinned fingerprint'; exit 1; }
          # Consume and checksum the entire script before execution. A direct
          # ssh ... sh -s makes Docker Compose subprocesses steal stdin from sh,
          # truncating a later "compose up" command to "com" (run 42591533875).
          # All forwarded inputs have strict shell-safe alphabet validation above.
          script_sha="$(sha256sum scripts/ci/deploy-vm13-preview.sh | awk '{print $1}')"
          [[ "$script_sha" =~ ^[a-f0-9]{64}$ ]] || { echo '::error::Invalid deployment script checksum'; exit 1; }
          ssh -i "$key_file" -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            "ubuntu@$host" \
            "set -eu; umask 077; script_file=\$(mktemp /tmp/eventgraph-vm13-preview.XXXXXXXX); trap 'rm -f \"\$script_file\"' EXIT; cat > \"\$script_file\"; actual_sha=\$(sha256sum \"\$script_file\" | awk '{print \$1}'); [ \"\$actual_sha\" = \"$script_sha\" ] || { echo 'VM13 deployment script transfer checksum mismatch' >&2; exit 1; }; EVENTGRAPH_IMAGE=$EVENTGRAPH_IMAGE EVENTGRAPH_PREVIEW_RELEASE=$EVENTGRAPH_PREVIEW_RELEASE EVENTGRAPH_PROD_TUNNEL_HOST_FINGERPRINT=$EVENTGRAPH_PROD_TUNNEL_HOST_FINGERPRINT sh \"\$script_file\"" \
            < scripts/ci/deploy-vm13-preview.sh

  # Acceptance runs on GitHub-hosted Actions with the official Playwright image.
  # GitHub checks VM13 directly; there is no SSH or dependency on cn-dev.
  e2e_vm13_preview:
    name: "验证 VM13 在线预览"
    needs: deploy_vm13_preview
    if: ${{ needs.deploy_vm13_preview.outputs.deployed == 'true' &&
             needs.deploy_vm13_preview.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.deploy_vm13_preview.outputs.release }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install browser test dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify deployed VM13 release directly from GitHub Actions
        env:
          EVENTGRAPH_PREVIEW_URL: http://43.133.185.154
          EVENTGRAPH_PREVIEW_RELEASE: ${{ needs.deploy_vm13_preview.outputs.release }}
        run: |
          docker run --rm --init --ipc=host --network host \
            -v "$PWD:/work" -w /work \
            -e EVENTGRAPH_PREVIEW_URL -e EVENTGRAPH_PREVIEW_RELEASE \
            mcr.microsoft.com/playwright:v1.61.1-noble \
            sh scripts/ci/smoke-vm13.sh

