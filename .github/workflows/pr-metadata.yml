# Only PR metadata validation runs when a title/body changes.
# The heavyweight Check workflow does not subscribe to pull_request.edited.
# REQUIRE this job in the develop/main rulesets before merging that change.
name: PR metadata

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enforce current PR Spec using the base branch's trusted gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          export SPEC_HEAD_SHA="$(jq -r '.head.sha' <<< "$pr")"
          # A past event must not validate a newer PR head using stale checkout.
          if [[ "$SPEC_HEAD_SHA" != "$EVENT_HEAD_SHA" ]]; then
            echo "::notice::Obsolete PR event; a newer PR event will validate its head"
            exit 0
          fi
          export SPEC_BASE_REF="$(jq -r '.base.ref' <<< "$pr")"
          export SPEC_HEAD_REF="$(jq -r '.head.ref' <<< "$pr")"
          export SPEC_HEAD_REPO="$(jq -r '.head.repo.full_name' <<< "$pr")"
          export SPEC_PR_AUTHOR="$(jq -r '.user.login' <<< "$pr")"
          export SPEC_PR_BODY="$(jq -r '.body // ""' <<< "$pr")"
          export SPEC_REPOSITORY="$GITHUB_REPOSITORY"
          git fetch --no-tags origin "$SPEC_BASE_REF"
          export SPEC_BASE_SHA="$(git rev-parse FETCH_HEAD)"
          git cat-file -e "$SPEC_HEAD_SHA^{commit}"
          git show "${SPEC_BASE_SHA}:scripts/ci/check-spec.mjs" > "$RUNNER_TEMP/check-spec.mjs"
          node "$RUNNER_TEMP/check-spec.mjs"
