name: One-time Spec Kit bootstrap

on:
  push:
    branches: [feature/spec-kit-claude-review]
    paths: ['.github/workflows/spec-kit-bootstrap.yml']

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.repository == 'jboone1989/EventGraph'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Run upstream Spec Kit CLI in clean GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/specify"
          "$RUNNER_TEMP/specify/bin/pip" install --disable-pip-version-check --quiet 'specify-cli==1.2.1'
          "$RUNNER_TEMP/specify/bin/specify" version
          cp .specify/memory/constitution.md "$RUNNER_TEMP/constitution-original.md"
          "$RUNNER_TEMP/specify/bin/specify" init --here --force --non-interactive --integration codex --script sh --ignore-agent-tools
          "$RUNNER_TEMP/specify/bin/specify" integration install claude --script sh --force
          "$RUNNER_TEMP/specify/bin/specify" integration status
          cmp .specify/memory/constitution.md "$RUNNER_TEMP/constitution-original.md"
          test -f .specify/templates/spec-template.md
          test -f .specify/templates/plan-template.md
          test -f .specify/templates/tasks-template.md
          test -f .specify/scripts/bash/check-prerequisites.sh
          find .agents/skills -type f -name SKILL.md | grep -q speckit
          find .claude/skills -type f -name SKILL.md | grep -q speckit
      - name: Commit official generated artifacts to same feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add .specify .agents/skills .claude/skills
          if git diff --cached --quiet; then
            echo 'No generated changes'; exit 0
          fi
          git diff --cached --name-only
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: install official Spec Kit 1.2.1 agent integrations'
          git push origin HEAD:feature/spec-kit-claude-review
