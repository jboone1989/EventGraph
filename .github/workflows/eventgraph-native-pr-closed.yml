name: EventGraph native agent PR lifecycle

on:
  pull_request:
    types: [opened, labeled, closed]

permissions:
  contents: read

concurrency:
  group: eventgraph-native-queue-continuation
  cancel-in-progress: false

jobs:
  resume:
    if: >-
      ${{ github.event.action == 'closed' &&
          github.event.pull_request.merged == false &&
          vars.EVENTGRAPH_NATIVE_QUEUE_EVENTS_ENABLED == 'true' &&
          github.event.pull_request.base.ref == 'develop' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.labels.*.name, 'agent-work') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install pinned official GH-AW CLI
        uses: github/gh-aw/actions/setup-cli@0627fdbe4beb5f3b71aa569f8d97150b87f2111a # v1.0.1
        with:
          version: v1.0.1
      - name: Resume via native Work Queue on PR close
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo '::error::GH_AW_GITHUB_TOKEN missing'; exit 1; }
          snapshot="$(gh aw work-queue --repo "$GITHUB_REPOSITORY" stats --json 2>&1)"
          jq -e '
            (.grants_paused | type == "boolean") and
            (.pools | type == "array") and
            all(.pools[]; (.pool | type == "string") and (.scheduling_eligible | type == "number"))
          ' <<< "$snapshot" >/dev/null || {
            echo '::error::Native queue stats missing or malformed'; exit 1;
          }
          if ! jq -e '
            .grants_paused == false and
            ([.pools[] | select(.pool == "default") | .scheduling_eligible] | add // 0) > 0
          ' <<< "$snapshot" >/dev/null; then
            echo 'Native queue paused or no eligible Work; nothing to dispatch'
            exit 0
          fi
          open="$(gh pr list --repo "$GITHUB_REPOSITORY" --base develop --state open --label agent-work --json number --jq 'length')"
          [[ "$open" == 0 ]] || { echo 'Open agent-work PR; no concurrent dispatch'; exit 0; }
          gh aw work-queue --repo "$GITHUB_REPOSITORY" dispatch eventgraph-dispatcher --wait

  enable_native_auto_merge:
    if: >-
      ${{ vars.EVENTGRAPH_NATIVE_QUEUE_EVENTS_ENABLED == 'true' &&
          (github.event.action == 'opened' || github.event.action == 'labeled') &&
          github.event.pull_request.base.ref == 'develop' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'agent/') &&
          github.event.pull_request.draft == false &&
          contains(github.event.pull_request.labels.*.name, 'agent-work') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable GitHub-native Auto-merge, respecting all required checks and review
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo '::error::GH_AW_GITHUB_TOKEN missing'; exit 1; }
          # Verify GitHub's live develop Ruleset, not an unverified
          # assumption that Check alone protects independent review.
          gh api "repos/$GITHUB_REPOSITORY/rulesets/25775731" | jq -e '
            .enforcement == "active" and
            (.conditions.ref_name.include | index("refs/heads/develop") != null) and
            any(.rules[]; .type == "required_status_checks" and
              any(.parameters.required_status_checks[]; .context == "claude-review"))
          ' >/dev/null || {
            echo '::error::Develop branch must require independent claude-review'; exit 1;
          }
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash
