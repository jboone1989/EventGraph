# Production is independent of PR CI, and uses only pinned develop digest.
name: "生产发布 · 镜像晋级与 VM09 部署"
run-name: "生产发布 · ${{ github.ref_name }}"
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main SHA to release
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: eventgraph-main-release
  cancel-in-progress: false
jobs:
  classify:
    name: "识别本次是否需要生产发布"
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.intent.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify pushed range or explicit pinned release
        id: intent
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]] ||
              { echo '::error::Manual release must pin main HEAD'; exit 1; }
            echo 'release=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          release="$(node scripts/ci/promotion-source-equivalence.mjs --classify-push "$BEFORE_SHA" "$GITHUB_SHA")"
          [[ "$release" == true || "$release" == false ]]
          echo "release=$release" >> "$GITHUB_OUTPUT"
          [[ "$release" == true ]] || echo '::notice::Governance-only push; no production promotion'

  promote:
    name: "验证并晋级已发布的镜像"
    needs: classify
    if: needs.classify.outputs.release == 'true' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      packages: read
      checks: read
      actions: read
    outputs:
      image_ref: ${{ steps.pin.outputs.image_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate pinned develop release
        id: pin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/production-image.env
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_REF" =~ ^ghcr\.io/jboone1989/eventgraph-app@sha256:[0-9a-f]{64}$ ]]
          git fetch origin "$SOURCE_SHA"
          # Source equivalence except automation and host-only deployment files.
          node scripts/ci/promotion-source-equivalence.mjs "$SOURCE_SHA" HEAD
          gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.conclusion == "success") | .name' > "$RUNNER_TEMP/develop-checks"
          if ! grep -Fxq 'release_develop / publish' "$RUNNER_TEMP/develop-checks"; then
            # A manually recovered develop image uses the same tested build/smoke
            # job but its GitHub check-run is named "publish" without a caller prefix.
            # Verify the successful check belongs to the expected workflow and SHA.
            manual_urls="$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | select(.name == "publish" and .conclusion == "success" and .app.slug == "github-actions") | .details_url')"
            manual_verified=false
            while IFS= read -r details; do
              [[ "$details" =~ /actions/runs/([0-9]+)/job/[0-9]+ ]] || continue
              run_id="${BASH_REMATCH[1]}"
              run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")" || continue
              if jq -e --arg sha "$SOURCE_SHA" '
                (.path == ".github/workflows/release-develop.yml" or
                 (.path | endswith("/.github/workflows/release-develop.yml"))) and
                .event == "workflow_dispatch" and .head_branch == "develop" and
                .head_sha == $sha
              ' <<< "$run_json" >/dev/null; then
                manual_verified=true
                break
              fi
            done <<< "$manual_urls"
            [[ "$manual_verified" == true ]] || {
              echo '::error::Pinned source has no verified automatic or manual develop publish'
              exit 1
            }
          fi
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR (read only)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Confirm immutable digest exists (no rebuild)
        env:
          IMAGE_REF: ${{ steps.pin.outputs.image_ref }}
        run: docker buildx imagetools inspect "$IMAGE_REF"

  # VM09 production deployment is opt-in until host SSH credentials are configured.
  deploy_production:
    name: "部署生产环境 VM09"
    needs: promote
    if: >-
      ${{ needs.promote.outputs.image_ref != '' &&
          vars.EVENTGRAPH_PROD_AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: eventgraph-prod-rollout
      cancel-in-progress: false
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy pinned image on VM09
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ vars.EVENTGRAPH_PROD_HOST }}
          username: ${{ vars.EVENTGRAPH_PROD_USER }}
          key: ${{ secrets.EVENTGRAPH_PROD_SSH_KEY }}
          fingerprint: ${{ secrets.EVENTGRAPH_PROD_SSH_FINGERPRINT }}
          envs: GHCR_TOKEN,GHCR_USER
          command_timeout: 13m
          version: '1.8.2'
          script: |
            cd /home/ubuntu/livingruntime-prod-source
            bash scripts/deploy-prod.sh


