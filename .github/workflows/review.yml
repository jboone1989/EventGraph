# Review on every pull request, next to Check (docs/review-pipeline.md):
#   risk     - sorts the PR into low / medium / high from the paths it changes and labels it
#   claude   - Claude's bug review, posted as inline comments (REVIEW.md, through CLAUDE.md)
#   security - a separate security review that comments on findings
# The two Claude jobs skip themselves until the repository has the secrets they need. Third-party actions
# are pinned to a full commit SHA, like the GitHub-owned ones in check.yml.
name: Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  risk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Classify
        id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Never execute the untrusted PR's classifier to decide its own risk.
          # The bootstrap PR has no classifier on main yet: fail closed as high.
          if git cat-file -e "$BASE:scripts/pr-risk.ts" 2>/dev/null; then
            git show "$BASE:scripts/pr-risk.ts" > "$RUNNER_TEMP/trusted-risk.ts"
            node "$RUNNER_TEMP/trusted-risk.ts" "$BASE" "$HEAD" > "$RUNNER_TEMP/risk.txt"
          else
            printf 'tier=high\nhigh\tbootstrap: no trusted classifier on base\n' > "$RUNNER_TEMP/risk.txt"
          fi
          tier="$(sed -n 's/^tier=//p' "$RUNNER_TEMP/risk.txt")"
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          {
            echo "## Risk: $tier"
            case "$tier" in
              low) echo "Docs and images only. Merge once Check is green and review threads are resolved." ;;
              medium) echo "Read Claude's findings and the PR's verification notes before merging." ;;
              high) echo "Read the diff yourself. For deploy changes run \`bash scripts/deploy-prod.sh --check\` on VM09 first." ;;
            esac
            echo
            echo '```'
            tail -n +2 "$RUNNER_TEMP/risk.txt" | head -n 60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Label
        # Pull requests from forks get a read-only token; the summary above still shows the tier.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TIER: ${{ steps.classify.outputs.tier }}
        run: |
          gh label create risk:low --color 0e8a16 --description "Docs and images only" --force
          gh label create risk:medium --color fbca04 --description "Ordinary code change" --force
          gh label create risk:high --color b60205 --description "Deploy, CI, migrations, auth or money" --force
          for t in low medium high; do
            if [ "$t" = "$TIER" ]; then gh pr edit "$PR" --add-label "risk:$t"; else gh pr edit "$PR" --remove-label "risk:$t" || true; fi
          done

  claude:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    env:
      HAS_CREDENTIAL: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Credential missing
        if: env.HAS_CREDENTIAL != 'true'
        run: echo "::notice::Set ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN to turn on Claude review (docs/review-pipeline.md)."
      - if: env.HAS_CREDENTIAL == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Claude review
        if: env.HAS_CREDENTIAL == 'true'
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'

  security:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: API key missing
        if: env.HAS_API_KEY != 'true'
        run: echo "::notice::Security review needs the ANTHROPIC_API_KEY secret (a subscription token is not enough for this action)."
      - if: env.HAS_API_KEY == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Security review
        if: env.HAS_API_KEY == 'true'
        uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda # main, 2026-10
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-model: claude-opus-5-5
          exclude-directories: docs,assets
          custom-security-scan-instructions: .github/security-review.md
