# EventGraph forwards a Check's exact SHA to the central GLM reviewer.
# Only a missing durable review status triggers an additional paid review; central
# preflight still authenticates the actual completed PR Check before model use.
name: Forward PR to central GLM review

on:
  workflow_run:
    workflows: [Check]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  review-status:
    # Reruns of a successful Check on the same SHA should not run a second
    # paid review after the durable claude-review verdict was recorded.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      required: ${{ steps.status.outputs.required }}
    steps:
      - name: Check for an existing GLM verdict at the exact Check SHA
        id: status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$CHECK_SHA" =~ ^[0-9a-f]{40}$ ]]
          state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$CHECK_SHA/status" \
            --jq '[.statuses[] | select(.context == "claude-review")][0].state // "missing"')"
          if [[ "$state" == missing ]]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          else
            echo "Already reviewed HEAD $CHECK_SHA: $state; no duplicate model dispatch"
            echo 'required=false' >> "$GITHUB_OUTPUT"
          fi

  official-glm-review:
    needs: review-status
    if: needs.review-status.outputs.required == 'true'
    # Every completed Check reaches central preflight. It checks the real source
    # run ID + event + success + exact HEAD before exposing the model secret.
    uses: jboone1989/livingruntime-remote/.github/workflows/eventgraph-glm-review.yml@main
    with:
      check_sha: ${{ github.event.workflow_run.head_sha }}
      check_run_id: ${{ github.event.workflow_run.id }}
      pr_number: ${{ github.event.workflow_run.pull_requests[0].number || '' }}
    secrets:
      GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
