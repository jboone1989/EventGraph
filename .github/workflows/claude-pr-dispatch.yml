# EventGraph forwards only a successful Check's exact PR HEAD to the central reviewer.
name: Forward PR to central GLM review

on:
  workflow_run:
    workflows: [Check]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  official-glm-review:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: jboone1989/livingruntime-remote/.github/workflows/eventgraph-glm-review.yml@main
    with:
      check_sha: ${{ github.event.workflow_run.head_sha }}
      pr_number: ${{ github.event.workflow_run.pull_requests[0].number || '' }}
    secrets:
      GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
