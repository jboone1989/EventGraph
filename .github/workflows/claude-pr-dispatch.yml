# EventGraph forwards only a successful Check's exact PR HEAD to the central reviewer.
name: Forward PR to central GLM review

on:
  workflow_run:
    workflows: [Check]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  review_preflight:
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      eligible: ${{ steps.plan.outputs.eligible }}
      required: ${{ steps.plan.outputs.required }}
      number: ${{ steps.plan.outputs.number }}
      base_ref: ${{ steps.plan.outputs.baseRef }}
      base_sha: ${{ steps.plan.outputs.baseSha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        id: plan
        env:
          CHECK_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { planReview } = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/scripts/ci/review-preflight.mjs').href);
            const plan = await planReview(github, { ...context.repo, runId: Number(process.env.CHECK_RUN_ID) });
            for (const [key, value] of Object.entries(plan)) core.setOutput(key, String(value));
            core.info(JSON.stringify(plan));

  official-glm-review:
    needs: review_preflight
    if: needs.review_preflight.outputs.eligible == 'true' && needs.review_preflight.outputs.required == 'true'
    concurrency:
      group: glm-current-pr-${{ needs.review_preflight.outputs.number }}
      cancel-in-progress: true
    # Every completed Check reaches central preflight. It checks the real source
    # run ID + event + success + exact HEAD before exposing the model secret.
    uses: jboone1989/livingruntime-remote/.github/workflows/eventgraph-glm-review.yml@main
    with:
      check_sha: ${{ github.event.workflow_run.head_sha }}
      check_run_id: ${{ github.event.workflow_run.id }}
      pr_number: ${{ needs.review_preflight.outputs.number }}
      base_ref: ${{ needs.review_preflight.outputs.base_ref }}
      base_sha: ${{ needs.review_preflight.outputs.base_sha }}
    secrets:
      GLM_API_KEY: ${{ secrets.GLM_API_KEY }}

  merge_gh_aw_agent_work:
    needs: [review_preflight, official-glm-review]
    if: >-
      ${{ always() && needs.review_preflight.outputs.eligible == 'true' &&
          (needs['official-glm-review'].result == 'success' || needs.review_preflight.outputs.required == 'false') &&
          github.event.workflow_run.event == 'workflow_dispatch' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          startsWith(github.event.workflow_run.head_branch, 'agent/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: read
    steps:
      - name: Revalidate exact GH-AW PR and merge through normal GitHub rules
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RUN_ID: ${{ github.event.workflow_run.id }}
          CHECK_SHA: ${{ github.event.workflow_run.head_sha }}
          CHECK_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REVIEW_BASE_REF: ${{ needs.review_preflight.outputs.base_ref }}
          REVIEW_BASE_SHA: ${{ needs.review_preflight.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHECK_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CHECK_BRANCH" == agent/* ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CHECK_RUN_ID")"
          jq -e --arg sha "$CHECK_SHA" --arg branch "$CHECK_BRANCH" --arg repo "$GITHUB_REPOSITORY" '
            .name == "Check" and .event == "workflow_dispatch" and
            .status == "completed" and .conclusion == "success" and
            .head_sha == $sha and .head_branch == $branch and
            .head_repository.full_name == $repo
          ' <<< "$run" > /dev/null
          prs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f base=develop -f per_page=100)"
          matches="$(jq --arg sha "$CHECK_SHA" --arg branch "$CHECK_BRANCH" --arg repo "$GITHUB_REPOSITORY" '
            [.[] | select(.state == "open" and (.draft|not) and
              .base.ref == "develop" and .base.repo.full_name == $repo and
              .head.repo.full_name == $repo and .head.sha == $sha and
              .head.ref == $branch and
              any(.labels[]?; .name == "agent-work"))]' <<< "$prs")"
          [[ "$(jq 'length' <<< "$matches")" == 1 ]] || {
            echo "::error::Need exactly one live, non-draft, same-repo agent-work PR at Check SHA"; exit 1;
          }
          number="$(jq -r '.[0].number' <<< "$matches")"
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CHECK_RUN_ID/jobs?per_page=100")"
          jq -e '
            ([.jobs[] | select(.name=="check") | .conclusion] == ["success"]) and
            ([.jobs[] | select(.name=="e2e") | .conclusion] | length == 1) and
            ([.jobs[] | select(.name=="docker") | .conclusion] | length == 1)
          ' <<< "$jobs" > /dev/null
          e2e="$(jq -r '.jobs[] | select(.name=="e2e") | .conclusion' <<< "$jobs")"
          docker="$(jq -r '.jobs[] | select(.name=="docker") | .conclusion' <<< "$jobs")"
          if [[ "$e2e" != success || "$docker" != success ]]; then
            [[ "$e2e" == skipped && "$docker" == skipped ]] || {
              echo '::error::E2E and Docker must both succeed or both explicitly skip'; exit 1;
            }
            # Match develop's trusted scope-changes.mjs documentation rules.
            files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$number/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)')"
            while IFS= read -r file; do
              [[ -n "$file" ]] || continue
              if [[ ! "$file" =~ ^(AGENTS|CLAUDE|README|CONTRIBUTING)\.md$ &&
                    ! ( "$file" =~ ^(docs|specs|\.specify|\.agents|\.claude)/ &&
                        "$file" =~ \.(md|txt|rst|adoc)$ ) ]]; then
                echo "::error::Skipped heavy tests on non-documentation file: $file"; exit 1;
              fi
            done <<< "$files"
          fi
          [[ "$REVIEW_BASE_REF" == develop && "$REVIEW_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          live_base="$(gh api "repos/$GITHUB_REPOSITORY/branches/develop" --jq '.commit.sha')"
          [[ "$live_base" == "$REVIEW_BASE_SHA" ]] || { echo '::error::Target moved since review'; exit 1; }
          status="$(gh api "repos/$GITHUB_REPOSITORY/commits/$CHECK_SHA/status")"
          jq -e --arg prefix "base=$REVIEW_BASE_REF@$REVIEW_BASE_SHA; " '[.statuses[] | select(.context == "claude-review")][0] | .state == "success" and (.description | startswith($prefix))' <<< "$status" >/dev/null || {
            echo "::error::Independent GLM review is not successful at the exact current SHA"; exit 1;
          }
          # Protect against a new push between the review and merge request.
          current="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number")"
          jq -e --arg sha "$CHECK_SHA" '.state == "open" and (.draft|not) and .head.sha == $sha' <<< "$current" >/dev/null
          # GitHub still enforces all branch rules; never use an admin override.
          merged="$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$number/merge" -f merge_method=squash -f sha="$CHECK_SHA")"
          merge_sha="$(jq -r '.sha' <<< "$merged")"
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Missing merge SHA"; exit 1; }
          # GITHUB_TOKEN merges do not normally generate a follow-on push workflow.
          gh workflow run check.yml --repo "$GITHUB_REPOSITORY" --ref develop -f "expected_sha=$merge_sha"
          echo "Squash-merged PR #$number at $merge_sha; re-entered develop Check."
