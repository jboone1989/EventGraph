# EventGraph's CI stays unchanged. Forward completed PR checks to the single
# Claude reviewer already running in jboone1989/livingruntime-remote.
# workflow_run executes the trusted default-branch workflow, not unreviewed PR files.
name: Forward PR to Claude review

on:
  workflow_run:
    workflows: [Check]
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send review event to central Runner
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_CENTRAL_DISPATCH_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Configure CLAUDE_CENTRAL_DISPATCH_TOKEN: fine-grained token scoped to livingruntime-remote (Contents: write)"
            exit 1
          fi
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          # GitHub automatically runs the central listener from its default branch.
          # Send only identifiers; central CLI loads and verifies the live PR head.
          gh api --method POST repos/jboone1989/livingruntime-remote/dispatches \
            -f event_type=claude-pr-review \
            -f 'client_payload[repository]=jboone1989/EventGraph' \
            -F "client_payload[pr_number]=$PR_NUMBER"
