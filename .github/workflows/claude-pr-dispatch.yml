# EventGraph forwards only a successful Check's exact PR HEAD to the central reviewer.
# GitHub branch protection and native PR actions own merge decisions; this workflow does not auto-merge.
name: Forward PR to central GLM review

on:
  workflow_run:
    workflows: [Check]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  official-glm-review:
    # Failed/cancelled push and unrelated Check runs must not start the costly
    # central reviewer. Keep workflow_dispatch for GH-AW's exact-SHA PR checks;
    # the central preflight still verifies the current PR and immutable SHA.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'pull_request' ||
           github.event.workflow_run.event == 'workflow_dispatch') }}
    uses: jboone1989/livingruntime-remote/.github/workflows/eventgraph-glm-review.yml@main
    with:
      check_sha: ${{ github.event.workflow_run.head_sha }}
      check_run_id: ${{ github.event.workflow_run.id }}
      pr_number: ${{ github.event.workflow_run.pull_requests[0].number || '' }}
    secrets:
      GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
