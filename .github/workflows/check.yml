# Checks on GitHub-hosted runners: install, typecheck, web build, the web and backend tests on a fresh
# PostgreSQL, the built site's smoke check on the empty database, and the Docker image brought up with docker compose.
# Official build Actions plus one reviewed SSH deployment Action; releases run only after passing checks.
# Documentation-only changes (the Spec gate's docs classification, detected by scripts/ci/scope-changes.mjs)
# skip the heavy steps and the e2e/docker jobs through job/step-level ifs: GitHub records skipped jobs as
# success for branch protection, the Spec gate and the docs validation still run, and the Claude dispatch
# still fires. Workflow-level path filters are NOT used: they leave required checks pending.
name: Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact immutable commit SHA for GH-AW PR or develop release re-entry"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: check-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Classifies the change range once with the base branch's detector (the same
  # trust model as the Spec gate) so heavy jobs can skip documentation-only
  # changes. Job-level ifs keep every required check reported as skipped=success.
  changes:
    if: github.event_name != 'push' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Enforce exact GH-AW dispatch SHA
        if: ${{ github.event_name == 'workflow_dispatch' && (github.ref_name == 'develop' || startsWith(github.ref_name, 'agent/')) }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Missing immutable expected_sha'; exit 1; }
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || { echo '::error::Dispatch ref moved'; exit 1; }
      - name: Detect documentation-only changes
        id: scope
        env:
          SCOPE_BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          SCOPE_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A GITHUB_TOKEN merge requires explicit develop workflow_dispatch.
          # Scope that exact release SHA against its first parent, not a missing PR payload.
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF_NAME" == develop ]]; then
            SCOPE_BASE_SHA="$(git rev-parse "$GITHUB_SHA^" 2>/dev/null || true)"
          fi
          if [[ "$SCOPE_BASE_SHA" =~ ^0+$ ]] || [[ -z "$SCOPE_BASE_SHA" ]]; then
            echo '::notice::No trustworthy change base; running the full pipeline'
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          detector="scripts/ci/scope-changes.mjs"
          if git cat-file -e "${SCOPE_BASE_SHA}:${detector}" 2>/dev/null; then
            # Never the candidate PR's modified copy: same rule as the Spec gate.
            git show "${SCOPE_BASE_SHA}:${detector}" > "$RUNNER_TEMP/scope-changes.mjs"
            detector="$RUNNER_TEMP/scope-changes.mjs"
          fi
          docs_only="$({ node "$detector" || true; } | sed -n 's/^docs_only=//p' | head -n1)"
          [[ "$docs_only" == true ]] || docs_only=false
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: github.event_name != 'push' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aihot_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/aihot_ci
      SITE_URL: http://127.0.0.1:3000
      API_BASE_URL: http://127.0.0.1:3001
      SESSION_SECRET: ci-session-secret-0123456789abcdef
      IMG_PROXY_SIGN_SECRET: ci-img-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Test Spec gate and scope detectors
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: node --test scripts/ci/check-spec.test.mjs scripts/ci/scope-changes.test.mjs scripts/ci/check-docs.test.mjs
      - name: Enforce pre-existing approved Spec
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SPEC_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SPEC_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SPEC_BASE_REF: ${{ github.event.pull_request.base.ref }}
          SPEC_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SPEC_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SPEC_REPOSITORY: ${{ github.repository }}
          SPEC_PR_BODY: ${{ github.event.pull_request.body }}
          SPEC_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            # A direct check on develop/main has no PR; other refs must resolve an exact open PR.
            if [[ "$GITHUB_REF_NAME" == develop || "$GITHUB_REF_NAME" == main ]]; then
              echo 'Direct branch check: no PR to gate'
              exit 0
            fi
            prs="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$GITHUB_REPOSITORY_OWNER:$GITHUB_REF_NAME&per_page=100")"
            count="$(jq --arg sha "$GITHUB_SHA" '[.[] | select(.head.sha == $sha and (.base.ref == "develop" or .base.ref == "main"))] | length' <<< "$prs")"
            [[ "$count" == 1 ]] || { echo '::error::Workflow dispatch must match exactly one open PR at this SHA'; exit 1; }
            pr="$(jq --arg sha "$GITHUB_SHA" '[.[] | select(.head.sha == $sha and (.base.ref == "develop" or .base.ref == "main"))][0]' <<< "$prs")"
            export SPEC_BASE_SHA="$(jq -r '.base.sha' <<< "$pr")"
            export SPEC_HEAD_SHA="$(jq -r '.head.sha' <<< "$pr")"
            export SPEC_BASE_REF="$(jq -r '.base.ref' <<< "$pr")"
            export SPEC_HEAD_REF="$(jq -r '.head.ref' <<< "$pr")"
            export SPEC_HEAD_REPO="$(jq -r '.head.repo.full_name' <<< "$pr")"
            export SPEC_PR_BODY="$(jq -r '.body // ""' <<< "$pr")"
            export SPEC_PR_AUTHOR="$(jq -r '.user.login' <<< "$pr")"
          fi
          # GitHub's pull_request payload can carry an old base SHA after the
          # branch has advanced. Always evaluate the exact current target branch.
          if [[ "$GITHUB_EVENT_NAME" == pull_request || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            SPEC_BASE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/$SPEC_BASE_REF" --jq '.commit.sha')"
            export SPEC_BASE_SHA
          fi
          # Use the previously merged gate, never the candidate PR's modified copy.
          if git cat-file -e "${SPEC_BASE_SHA}:scripts/ci/check-spec.mjs" 2>/dev/null; then
            git show "${SPEC_BASE_SHA}:scripts/ci/check-spec.mjs" > "$RUNNER_TEMP/check-spec.mjs"
            node "$RUNNER_TEMP/check-spec.mjs"
          else
            # First installation is externally reviewed as a special bootstrap.
            node scripts/ci/check-spec.mjs
          fi
      - name: Docs-only validation
        # Documentation-only changes skip the heavy steps below but still get a
        # real check: the Spec gate above plus this offline Markdown validation.
        if: needs.changes.outputs.docs_only == 'true'
        env:
          SCOPE_BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          SCOPE_HEAD_SHA: ${{ github.sha }}
        run: |
          # Explicit develop re-entry has no push/PR payload; use the validated
          # release commit's first parent as the same scope base as changes.
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF_NAME" == develop ]]; then
            SCOPE_BASE_SHA="$(git rev-parse "$GITHUB_SHA^" 2>/dev/null || true)"
          fi
          if [[ "$SCOPE_BASE_SHA" =~ ^0+$ ]] || [[ -z "$SCOPE_BASE_SHA" ]]; then
            echo '::error::Cannot validate documentation without a trusted base commit' >&2
            exit 1
          fi
          export SCOPE_BASE_SHA
          node scripts/ci/check-docs.mjs
      - name: Install
        if: needs.changes.outputs.docs_only != 'true'
        run: npm ci --no-audit --no-fund
      - name: Online migration safety
        if: needs.changes.outputs.docs_only != 'true'
        # New migrations against the PR base: deployed ones unchanged, no whole-table rewrite or blocking index in a release.
        env:
          MIGRATION_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$MIGRATION_BASE" =~ ^0+$ ]] || [[ -z "$MIGRATION_BASE" ]]; then
            MIGRATION_BASE="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          node scripts/check-migrations.ts --base "$MIGRATION_BASE"
      - name: PostgreSQL backup tools
        if: needs.changes.outputs.docs_only != 'true'
        # 恢复测试需要与 PostgreSQL 17 服务匹配的客户端，不能依赖 runner 的默认版本。
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version
      - name: Release script validation
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          bash -n scripts/deploy-prod.sh
          sh -n scripts/ci/deploy-vm13-preview.sh
          sh -n scripts/ci/smoke-vm13.sh
          python3 -m py_compile scripts/production-env-check.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec=importlib.util.spec_from_file_location("envcheck","scripts/production-env-check.py")
          assert spec and spec.loader
          envcheck=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(envcheck)
          prod=envcheck.read_env(Path("config/environments/production.flags.env.example"))
          assert any("NVIDIA_API_KEY" in issue for issue in envcheck.errors(prod,"production"))
          prod.update({"NVIDIA_API_KEY":"testing-only","NVIDIA_BASE_URL":"https://test.invalid"})
          assert not envcheck.errors(prod,"production")
          prod["MODEL_CALLS_ENABLED"]="false"
          assert envcheck.errors(prod,"production")
          PY
      - name: NVIDIA pool regression tests
        if: needs.changes.outputs.docs_only != 'true'
        run: node --import ./tests/standalone.ts --test tests/nvidia*.standalone.test.ts
      - name: Typecheck
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run typecheck
      # Fail closed on policy-page placeholders or a missing contact email (specs/003-content-assets FR-009):
      # an AdSense review would reject it, so a PR must not get that far either.
      - name: AdSense preflight
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run adsense:preflight
      - name: Build web
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run build -w @aihot/web
      # The official Playwright image already has matching Chromium/WebKit binaries and
      # native OS libraries. Reinstalling WebKit's hundreds of apt packages on each
      # GitHub runner can stall longer than this job's 25-minute hard limit.
      - name: Web tests (Chromium + WebKit, official Playwright image)
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          docker run --rm --init --ipc=host --network host \
            -v "$PWD:/work" -w /work \
            -e DATABASE_URL -e SITE_URL -e API_BASE_URL \
            -e SESSION_SECRET -e IMG_PROXY_SIGN_SECRET \
            mcr.microsoft.com/playwright:v1.61.1-noble \
            node --test apps/web/tests/*.test.ts

      # Each test file runs on its own copy of aihot_ci (tests/databases.ts), which the run migrates and
      # leaves empty; the smoke check then reads that empty database.
      - name: Backend tests
        if: needs.changes.outputs.docs_only != 'true'
        run: npm test
      - name: Smoke check of the built site
        if: needs.changes.outputs.docs_only != 'true'
        # The site itself runs with collection and model calls off (the tests above use local stubs).
        env:
          COLLECT_ENABLED: "false"
          MODEL_CALLS_ENABLED: "false"
        run: |
          node apps/api/src/main.ts > "$RUNNER_TEMP/api.log" 2>&1 &
          (cd apps/web && NODE_ENV=production exec node server.ts) > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:3000/api/health 2>/dev/null && break; sleep 1; done
          node scripts/smoke.ts --base http://127.0.0.1:3000
          node scripts/mcp-check.ts http://127.0.0.1:3000/api/mcp
      - name: Server logs
        if: failure()
        run: tail -n 60 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log" 2>/dev/null || true

  e2e:
    needs: changes
    if: >-
      ${{ (github.event_name != 'push' || github.ref_name == 'develop') &&
          needs.changes.outputs.docs_only != 'true' }}
    # Its own job, so a red backend test does not hide what the browser checks find.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aihot_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/aihot_ci
      SITE_URL: http://127.0.0.1:3000
      API_BASE_URL: http://127.0.0.1:3001
      SESSION_SECRET: ci-session-secret-0123456789abcdef
      IMG_PROXY_SIGN_SECRET: ci-img-secret-0123456789abcdef
      COLLECT_ENABLED: "false"
      MODEL_CALLS_ENABLED: "false"
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_SEEDED: "1" # This job always initializes a fresh database and runs e2e-seed.ts.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build web
        run: npm run build -w @aihot/web
      - name: Browser engine
        run: npx playwright install --with-deps chromium
      - name: Migrate and seed
        run: |
          node scripts/migrate.ts
          node scripts/e2e-seed.ts
      - name: Start the built site
        run: |
          node apps/api/src/main.ts > "$RUNNER_TEMP/api.log" 2>&1 &
          (cd apps/web && NODE_ENV=production exec node server.ts) > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:3000/api/health 2>/dev/null && break; sleep 1; done
      - name: Browser checks
        run: npm run e2e
      - name: Report
        # The HTML report with screenshots of every page, and a trace of each failure.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: .data/e2e/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Server logs
        if: failure()
        run: tail -n 60 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log" 2>/dev/null || true

  docker:
    needs: changes
    # Docker integration runs for PRs; the branch push builds the publishable image separately.
    # Bot-created upstream PRs explicitly dispatch Check; include Docker on those runs.
    if: >-
      ${{ (github.event_name == 'pull_request' ||
           (github.event_name == 'workflow_dispatch' && (startsWith(github.ref_name, 'chore/aihot-upstream-') || startsWith(github.ref_name, 'agent/')))) &&
          needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Configure a throwaway site
        run: |
          node scripts/init-env.ts --llm-key ci-not-a-real-key
          # No outside calls in CI: nothing is collected and no model is asked.
          sed -i 's/^COLLECT_ENABLED=.*/COLLECT_ENABLED=false/; s/^MODEL_CALLS_ENABLED=.*/MODEL_CALLS_ENABLED=false/' .env
          # The smoke check reaches the site by its compose service name.
          echo "MCP_ALLOWED_HOSTS=web" >> .env
      - name: Build and start with docker compose
        run: docker compose up -d --build
      - name: Smoke check
        run: |
          for i in $(seq 1 90); do curl -fsS -o /dev/null http://127.0.0.1:3000/api/health 2>/dev/null && break; sleep 2; done
          docker compose ps
          docker compose run --rm --no-deps --entrypoint node setup scripts/smoke.ts --base http://web:3000
          docker compose exec -T db psql -U aihot -d aihot -Atc "select count(*) from sources" | grep -qx "$(node -p "require('./industry/sources.json').sources.length")"
          # Both keys must be enabled after the idempotent image setup.
          docker compose exec -T db psql -U aihot -d aihot -Atc "select count(*) from settings where key in ('sourceLifecycle.discovery','sourceLifecycle.autoPromote') and value->>'enabled' = 'true'" | grep -qx '2'
      - name: Logs
        if: failure()
        run: docker compose logs --tail 80
      - name: Stop
        if: always()
        run: docker compose down -v

  # CI success on develop/main publishes one immutable image; only develop auto-deploys.
  # Documentation-only develop pushes change no artifact and publish nothing.
  publish:
    needs: [changes, check, e2e]
    if: >-
      ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.expected_sha != '' && inputs.expected_sha == github.sha)) && github.ref_name == 'develop' &&
          needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.ref.outputs.image_ref }}
      source_sha: ${{ github.sha }}
    steps:
      - name: Checkout passing SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Skip superseded commits
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_BRANCH" == develop || "$SOURCE_BRANCH" == main ]]
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/$SOURCE_BRANCH" --jq '.commit.sha')"
          if [[ "$current" != "$SOURCE_SHA" ]]; then
            if [[ "$(git rev-parse --is-shallow-repository)" == true ]]; then
              git fetch --unshallow origin "$current"
            else
              git fetch origin "$current"
            fi
          fi
          # Supersession by content (specs/010): a documentation-only tip does not
          # suppress this pending code release; any later executable change does.
          # The release's own checkout decides and fails closed on any error.
          release="$(SOURCE_SHA="$SOURCE_SHA" HEAD_SHA="$current" \
            node scripts/ci/release-candidate.mjs | sed -n 's/^current=//p' | head -n1)"
          if [[ "$release" == true ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::A newer executable commit exists; skip obsolete build'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.current.outputs.publish == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: steps.current.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        if: steps.current.outputs.publish == 'true'
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jboone1989/eventgraph-app:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VITE_GISCUS_CATEGORY_ID=${{ vars.EVENTGRAPH_GISCUS_CATEGORY_ID }}
          cache-from: type=gha,scope=eventgraph-app
          cache-to: type=gha,mode=max,scope=eventgraph-app

      - name: Export immutable digest
        if: steps.current.outputs.publish == 'true'
        id: ref
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image_ref=ghcr.io/jboone1989/eventgraph-app@$DIGEST" >> "$GITHUB_OUTPUT"

      # The source checks do not cover the separately built GHCR digest.
      - name: Node for published-image smoke check
        if: steps.current.outputs.publish == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Smoke-test published digest with Compose (no rebuild)
        if: steps.current.outputs.publish == 'true'
        timeout-minutes: 12
        env:
          EVENTGRAPH_APP_IMAGE: ${{ steps.ref.outputs.image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EVENTGRAPH_APP_IMAGE" =~ ^ghcr\.io/jboone1989/eventgraph-app@sha256:[a-f0-9]{64}$ ]]
          node scripts/init-env.ts --llm-key ci-not-a-real-key
          sed -i 's/^COLLECT_ENABLED=.*/COLLECT_ENABLED=false/; s/^MODEL_CALLS_ENABLED=.*/MODEL_CALLS_ENABLED=false/' .env
          grep -qx 'COLLECT_ENABLED=false' .env
          grep -qx 'MODEL_CALLS_ENABLED=false' .env
          echo "MCP_ALLOWED_HOSTS=web" >> .env
          cat > "$RUNNER_TEMP/ci-published-image.yml" <<'COMPOSE'
          services:
            setup:
              image: ${EVENTGRAPH_APP_IMAGE:?}
            api:
              image: ${EVENTGRAPH_APP_IMAGE:?}
            worker:
              image: ${EVENTGRAPH_APP_IMAGE:?}
            web:
              image: ${EVENTGRAPH_APP_IMAGE:?}
          COMPOSE
          docker pull "$EVENTGRAPH_APP_IMAGE"
          # --pull never applies to the PostgreSQL dependency too; preload its official image.
          docker pull postgres:17-alpine
          docker compose -f docker-compose.yml -f "$RUNNER_TEMP/ci-published-image.yml" config --quiet
          docker compose -f docker-compose.yml -f "$RUNNER_TEMP/ci-published-image.yml" up -d --no-build --pull never
          healthy=0
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/api/health 2>/dev/null; then healthy=1; break; fi
            sleep 2
          done
          if [[ "$healthy" -ne 1 ]]; then
            echo '::error::Published image failed HTTP health check' >&2
            exit 1
          fi
          docker compose -f docker-compose.yml -f "$RUNNER_TEMP/ci-published-image.yml" ps
          docker compose -f docker-compose.yml -f "$RUNNER_TEMP/ci-published-image.yml" run --rm --no-deps --entrypoint node setup scripts/smoke.ts --base http://web:3000
          docker compose -f docker-compose.yml -f "$RUNNER_TEMP/ci-published-image.yml" exec -T db psql -U aihot -d aihot -Atc "select count(*) from sources" | grep -qx "$(node -p "require('./industry/sources.json').sources.length")"

      - name: Published-image smoke logs
        if: ${{ failure() && steps.current.outputs.publish == 'true' }}
        env:
          EVENTGRAPH_APP_IMAGE: ${{ steps.ref.outputs.image_ref }}
        run: |
          if test -f "$RUNNER_TEMP/ci-published-image.yml"; then
            docker compose -f docker-compose.yml -f "$RUNNER_TEMP/ci-published-image.yml" logs --tail 80
          fi

      - name: Clean published-image smoke environment
        if: ${{ always() && steps.current.outputs.publish == 'true' }}
        env:
          EVENTGRAPH_APP_IMAGE: ${{ steps.ref.outputs.image_ref }}
        run: |
          if test -f "$RUNNER_TEMP/ci-published-image.yml"; then
            docker compose -f docker-compose.yml -f "$RUNNER_TEMP/ci-published-image.yml" down -v
          fi

  # Main consumes exactly the already tested develop image digest, never rebuilds.
  promote:
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      packages: read
      checks: read
    outputs:
      image_ref: ${{ steps.pin.outputs.image_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate pinned develop release
        id: pin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/production-image.env
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_REF" =~ ^ghcr\.io/jboone1989/eventgraph-app@sha256:[0-9a-f]{64}$ ]]
          git fetch origin "$SOURCE_SHA"
          # Source equivalence except automation and host-only deployment files.
          git diff --quiet "$SOURCE_SHA" HEAD -- . \
            ':(exclude).github/**' ':(exclude)scripts/deploy-prod.sh' \
            ':(exclude)docs/ci-cd.md' ':(exclude)docs/production-deployment.md'
          gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.conclusion == "success") | .name' > "$RUNNER_TEMP/develop-checks"
          for check in check e2e publish; do
            grep -Fxq "$check" "$RUNNER_TEMP/develop-checks" || { echo "::error::Missing successful develop $check"; exit 1; }
          done
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR (read only)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Confirm immutable digest exists (no rebuild)
        env:
          IMAGE_REF: ${{ steps.pin.outputs.image_ref }}
        run: docker buildx imagetools inspect "$IMAGE_REF"

  # VM09 production deployment is opt-in until host SSH credentials are configured.
  deploy_production:
    needs: promote
    if: >-
      ${{ needs.promote.outputs.image_ref != '' &&
          vars.EVENTGRAPH_PROD_AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: eventgraph-prod-rollout
      cancel-in-progress: false
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy pinned image on VM09
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ vars.EVENTGRAPH_PROD_HOST }}
          username: ${{ vars.EVENTGRAPH_PROD_USER }}
          key: ${{ secrets.EVENTGRAPH_PROD_SSH_KEY }}
          fingerprint: ${{ secrets.EVENTGRAPH_PROD_SSH_FINGERPRINT }}
          envs: GHCR_TOKEN,GHCR_USER
          command_timeout: 13m
          version: '1.8.2'
          script: |
            cd /home/ubuntu/livingruntime-prod-source
            bash scripts/deploy-prod.sh


  # cn-dev handles the worker and data services; it is not a release gateway for VM13.
  # No image pull or Web/API deployment is performed on cn-dev by this workflow.
  # VM13 runs the development Web and API from the same tested digest; the API
  # reaches the cn-dev development database only through the on-host SSH tunnel.
  deploy_vm13_preview:
    needs: publish
    if: >-
      ${{ (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.expected_sha != '' && inputs.expected_sha == github.sha)) &&
          github.ref_name == 'develop' &&
          needs.publish.outputs.image_ref != '' &&
          vars.EVENTGRAPH_DEV_AUTO_DEPLOY == 'true' }}
    concurrency:
      group: eventgraph-vm13-preview
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    permissions:
      contents: read
      packages: read
    outputs:
      deployed: ${{ steps.current.outputs.deploy }}
      release: ${{ needs.publish.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.source_sha }}
          persist-credentials: false
      - name: Skip superseded release
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.publish.outputs.source_sha }}
        shell: bash
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/develop" --jq '.commit.sha' || true)"
          if [[ -n "$current" && "$current" != "$SOURCE_SHA" ]]; then
            if [[ "$(git rev-parse --is-shallow-repository)" == true ]]; then
              git fetch --unshallow origin "$current" || true
            else
              git fetch origin "$current" || true
            fi
          fi
          # Same content-based supersession as publish (specs/010): deploy the
          # published release unless a later executable change exists; fail
          # closed — an unreadable branch tip skips the deployment.
          release="$({ SOURCE_SHA="$SOURCE_SHA" HEAD_SHA="$current" node scripts/ci/release-candidate.mjs || true; } \
            | sed -n 's/^current=//p' | head -n1)"
          if [[ "$release" == true ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo '::notice::A newer executable or unreadable branch tip; skip release'
          fi
      - name: Deploy VM13 Web and API on the cn-dev development database
        if: steps.current.outputs.deploy == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          EVENTGRAPH_IMAGE: ${{ needs.publish.outputs.image_ref }}
          EVENTGRAPH_PREVIEW_RELEASE: ${{ needs.publish.outputs.source_sha }}
          EVENTGRAPH_DEV_SSH_FINGERPRINT: ${{ secrets.EVENTGRAPH_DEV_SSH_FINGERPRINT }}
        with:
          host: 43.133.185.154
          username: ubuntu
          key: ${{ secrets.EVENTGRAPH_DEV_SSH_KEY }}
          fingerprint: SHA256:950EdynTTleTOtbmusu5UrYvSQwgsl4hX3/frQniLh4
          envs: EVENTGRAPH_IMAGE,EVENTGRAPH_PREVIEW_RELEASE,EVENTGRAPH_DEV_SSH_FINGERPRINT
          command_timeout: 12m
          version: '1.8.2'
          script_path: scripts/ci/deploy-vm13-preview.sh

  # Acceptance runs on cn-dev: API digest/backend/admin/write checks in
  # scripts/ci/smoke-vm13.sh plus the Chromium page checks; never on VM13 itself.
  e2e_vm13_preview:
    needs: deploy_vm13_preview
    if: ${{ needs.deploy_vm13_preview.outputs.deployed == 'true' &&
             needs.deploy_vm13_preview.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run cn-dev Chromium against VM13
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          EVENTGRAPH_PREVIEW_URL: http://43.133.185.154
          EVENTGRAPH_PREVIEW_RELEASE: ${{ needs.deploy_vm13_preview.outputs.release }}
        with:
          host: ${{ vars.EVENTGRAPH_DEV_HOST }}
          username: ${{ vars.EVENTGRAPH_DEV_USER }}
          key: ${{ secrets.EVENTGRAPH_DEV_SSH_KEY }}
          fingerprint: ${{ secrets.EVENTGRAPH_DEV_SSH_FINGERPRINT }}
          envs: EVENTGRAPH_PREVIEW_URL,EVENTGRAPH_PREVIEW_RELEASE
          command_timeout: 8m
          version: '1.8.2'
          script_path: scripts/ci/smoke-vm13.sh
  resume_gh_aw_queue:
    needs: [changes, check, e2e, publish]
    if: >-
      ${{ always() && (vars.EVENTGRAPH_GH_AW_QUEUE_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.expected_sha != '' && inputs.expected_sha == github.sha)) &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref_name == 'develop' &&
          needs.check.result == 'success' &&
          ((needs.changes.outputs.docs_only == 'true' &&
            needs.e2e.result == 'skipped' && needs.publish.result == 'skipped') ||
           (needs.changes.outputs.docs_only != 'true' &&
            needs.e2e.result == 'success' && needs.publish.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Verify current develop head and request next GH-AW dispatch gate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/develop" --jq '.commit.sha')"
          [[ "$current" == "$SOURCE_SHA" ]] || { echo 'Develop advanced; no queue continuation'; exit 0; }
          gh workflow run eventgraph-dispatch-gate.yml --repo "$GITHUB_REPOSITORY" --ref main
