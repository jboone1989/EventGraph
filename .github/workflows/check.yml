# Checks on GitHub-hosted runners: install, typecheck, web build, the web and backend tests on a fresh
# PostgreSQL, the built site's smoke check on the empty database, and the Docker image brought up with docker compose.
# Official build Actions plus one reviewed SSH deployment Action; releases run only after passing checks.
name: Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name != 'push' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aihot_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/aihot_ci
      SITE_URL: http://127.0.0.1:3000
      API_BASE_URL: http://127.0.0.1:3001
      SESSION_SECRET: ci-session-secret-0123456789abcdef
      IMG_PROXY_SIGN_SECRET: ci-img-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Online migration safety
        # New migrations against the PR base: deployed ones unchanged, no whole-table rewrite or blocking index in a release.
        env:
          MIGRATION_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$MIGRATION_BASE" =~ ^0+$ ]] || [[ -z "$MIGRATION_BASE" ]]; then
            MIGRATION_BASE="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          node scripts/check-migrations.ts --base "$MIGRATION_BASE"
      - name: PostgreSQL backup tools
        # 恢复测试需要与 PostgreSQL 17 服务匹配的客户端，不能依赖 runner 的默认版本。
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version
      - name: Release script validation
        run: |
          bash -n scripts/deploy-prod.sh
          python3 -m py_compile scripts/production-env-check.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec=importlib.util.spec_from_file_location("envcheck","scripts/production-env-check.py")
          assert spec and spec.loader
          envcheck=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(envcheck)
          prod=envcheck.read_env(Path("config/environments/production.flags.env.example"))
          assert any("NVIDIA_API_KEY" in issue for issue in envcheck.errors(prod,"production"))
          prod.update({"NVIDIA_API_KEY":"testing-only","NVIDIA_BASE_URL":"https://test.invalid"})
          assert not envcheck.errors(prod,"production")
          prod["MODEL_CALLS_ENABLED"]="false"
          assert envcheck.errors(prod,"production")
          PY
      - name: NVIDIA pool regression tests
        run: node --import ./tests/standalone.ts --test tests/nvidia*.standalone.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Build web
        run: npm run build -w @aihot/web
      - name: Browser test engines
        run: npx playwright install --with-deps chromium webkit
      - name: Web tests
        run: node --test apps/web/tests/*.test.ts

      # Each test file runs on its own copy of aihot_ci (tests/databases.ts), which the run migrates and
      # leaves empty; the smoke check then reads that empty database.
      - name: Backend tests
        run: npm test
      - name: Smoke check of the built site
        # The site itself runs with collection and model calls off (the tests above use local stubs).
        env:
          COLLECT_ENABLED: "false"
          MODEL_CALLS_ENABLED: "false"
        run: |
          node apps/api/src/main.ts > "$RUNNER_TEMP/api.log" 2>&1 &
          (cd apps/web && NODE_ENV=production exec node server.ts) > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:3000/api/health 2>/dev/null && break; sleep 1; done
          node scripts/smoke.ts --base http://127.0.0.1:3000
          node scripts/mcp-check.ts http://127.0.0.1:3000/api/mcp
      - name: Server logs
        if: failure()
        run: tail -n 60 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log" 2>/dev/null || true

  e2e:
    if: github.event_name != 'push' || github.ref_name == 'develop'
    # Its own job, so a red backend test does not hide what the browser checks find.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aihot_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/aihot_ci
      SITE_URL: http://127.0.0.1:3000
      API_BASE_URL: http://127.0.0.1:3001
      SESSION_SECRET: ci-session-secret-0123456789abcdef
      IMG_PROXY_SIGN_SECRET: ci-img-secret-0123456789abcdef
      COLLECT_ENABLED: "false"
      MODEL_CALLS_ENABLED: "false"
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_SEEDED: "1" # This job always initializes a fresh database and runs e2e-seed.ts.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build web
        run: npm run build -w @aihot/web
      - name: Browser engine
        run: npx playwright install --with-deps chromium
      - name: Migrate and seed
        run: |
          node scripts/migrate.ts
          node scripts/e2e-seed.ts
      - name: Start the built site
        run: |
          node apps/api/src/main.ts > "$RUNNER_TEMP/api.log" 2>&1 &
          (cd apps/web && NODE_ENV=production exec node server.ts) > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:3000/api/health 2>/dev/null && break; sleep 1; done
      - name: Browser checks
        run: npm run e2e
      - name: Report
        # The HTML report with screenshots of every page, and a trace of each failure.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: .data/e2e/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Server logs
        if: failure()
        run: tail -n 60 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log" 2>/dev/null || true

  docker:
    # Docker integration runs for PRs; the branch push builds the publishable image separately.
    # Bot-created upstream PRs explicitly dispatch Check; include Docker on those runs.
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'chore/aihot-upstream-'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Configure a throwaway site
        run: |
          node scripts/init-env.ts --llm-key ci-not-a-real-key
          # No outside calls in CI: nothing is collected and no model is asked.
          sed -i 's/^COLLECT_ENABLED=.*/COLLECT_ENABLED=false/; s/^MODEL_CALLS_ENABLED=.*/MODEL_CALLS_ENABLED=false/' .env
          # The smoke check reaches the site by its compose service name.
          echo "MCP_ALLOWED_HOSTS=web" >> .env
      - name: Build and start with docker compose
        run: docker compose up -d --build
      - name: Smoke check
        run: |
          for i in $(seq 1 90); do curl -fsS -o /dev/null http://127.0.0.1:3000/api/health 2>/dev/null && break; sleep 2; done
          docker compose ps
          docker compose run --rm --no-deps --entrypoint node setup scripts/smoke.ts --base http://web:3000
          docker compose exec -T db psql -U aihot -d aihot -Atc "select count(*) from sources" | grep -qx "$(node -p "require('./industry/sources.json').sources.length")"
      - name: Logs
        if: failure()
        run: docker compose logs --tail 80
      - name: Stop
        if: always()
        run: docker compose down -v

  # CI success on develop/main publishes one immutable image; only develop auto-deploys.
  publish:
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.ref.outputs.image_ref }}
      source_sha: ${{ github.sha }}
    steps:
      - name: Checkout passing SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Skip superseded commits
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_BRANCH" == develop || "$SOURCE_BRANCH" == main ]]
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/$SOURCE_BRANCH" --jq '.commit.sha')"
          if [[ "$current" == "$SOURCE_SHA" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::A newer commit exists; skip obsolete build'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.current.outputs.publish == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: steps.current.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        if: steps.current.outputs.publish == 'true'
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jboone1989/eventgraph-app:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=eventgraph-app
          cache-to: type=gha,mode=max,scope=eventgraph-app

      - name: Export immutable digest
        if: steps.current.outputs.publish == 'true'
        id: ref
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image_ref=ghcr.io/jboone1989/eventgraph-app@$DIGEST" >> "$GITHUB_OUTPUT"

      # The source checks do not cover the separately built GHCR digest.
      - name: Node for published-image smoke check
        if: steps.current.outputs.publish == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Smoke-test published digest with Compose (no rebuild)
        if: steps.current.outputs.publish == 'true'
        timeout-minutes: 12
        env:
          EVENTGRAPH_APP_IMAGE: ${{ steps.ref.outputs.image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EVENTGRAPH_APP_IMAGE" =~ ^ghcr\.io/jboone1989/eventgraph-app@sha256:[a-f0-9]{64}$ ]]
          node scripts/init-env.ts --llm-key ci-not-a-real-key
          sed -i 's/^COLLECT_ENABLED=.*/COLLECT_ENABLED=false/; s/^MODEL_CALLS_ENABLED=.*/MODEL_CALLS_ENABLED=false/' .env
          grep -qx 'COLLECT_ENABLED=false' .env
          grep -qx 'MODEL_CALLS_ENABLED=false' .env
          echo "MCP_ALLOWED_HOSTS=web" >> .env
          cat > "$RUNNER_TEMP/ci-published-image.yml" <<'COMPOSE'
          services:
            setup:
              image: ${EVENTGRAPH_APP_IMAGE:?}
            api:
              image: ${EVENTGRAPH_APP_IMAGE:?}
            worker:
              image: ${EVENTGRAPH_APP_IMAGE:?}
            web:
              image: ${EVENTGRAPH_APP_IMAGE:?}
          COMPOSE
          docker pull "$EVENTGRAPH_APP_IMAGE"
          # --pull never applies to the PostgreSQL dependency too; preload its official image.
          docker pull postgres:17-alpine
          docker compose -f docker-compose.yml -f "$RUNNER_TEMP/ci-published-image.yml" config --quiet
          docker compose -f docker-compose.yml -f "$RUNNER_TEMP/ci-published-image.yml" up -d --no-build --pull never
          healthy=0
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/api/health 2>/dev/null; then healthy=1; break; fi
            sleep 2
          done
          if [[ "$healthy" -ne 1 ]]; then
            echo '::error::Published image failed HTTP health check' >&2
            exit 1
          fi
          docker compose -f docker-compose.yml -f "$RUNNER_TEMP/ci-published-image.yml" ps
          docker compose -f docker-compose.yml -f "$RUNNER_TEMP/ci-published-image.yml" run --rm --no-deps --entrypoint node setup scripts/smoke.ts --base http://web:3000
          docker compose -f docker-compose.yml -f "$RUNNER_TEMP/ci-published-image.yml" exec -T db psql -U aihot -d aihot -Atc "select count(*) from sources" | grep -qx "$(node -p "require('./industry/sources.json').sources.length")"

      - name: Published-image smoke logs
        if: ${{ failure() && steps.current.outputs.publish == 'true' }}
        env:
          EVENTGRAPH_APP_IMAGE: ${{ steps.ref.outputs.image_ref }}
        run: |
          if test -f "$RUNNER_TEMP/ci-published-image.yml"; then
            docker compose -f docker-compose.yml -f "$RUNNER_TEMP/ci-published-image.yml" logs --tail 80
          fi

      - name: Clean published-image smoke environment
        if: ${{ always() && steps.current.outputs.publish == 'true' }}
        env:
          EVENTGRAPH_APP_IMAGE: ${{ steps.ref.outputs.image_ref }}
        run: |
          if test -f "$RUNNER_TEMP/ci-published-image.yml"; then
            docker compose -f docker-compose.yml -f "$RUNNER_TEMP/ci-published-image.yml" down -v
          fi

  # Main consumes exactly the already tested develop image digest, never rebuilds.
  promote:
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      packages: read
      checks: read
    outputs:
      image_ref: ${{ steps.pin.outputs.image_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate pinned develop release
        id: pin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/production-image.env
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_REF" =~ ^ghcr\.io/jboone1989/eventgraph-app@sha256:[0-9a-f]{64}$ ]]
          git fetch origin "$SOURCE_SHA"
          # Source equivalence except automation and host-only deployment files.
          git diff --quiet "$SOURCE_SHA" HEAD -- . \
            ':(exclude).github/**' ':(exclude)scripts/deploy-prod.sh' \
            ':(exclude)docs/ci-cd.md' ':(exclude)docs/production-deployment.md'
          gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.conclusion == "success") | .name' > "$RUNNER_TEMP/develop-checks"
          for check in check e2e publish; do
            grep -Fxq "$check" "$RUNNER_TEMP/develop-checks" || { echo "::error::Missing successful develop $check"; exit 1; }
          done
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR (read only)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Confirm immutable digest exists (no rebuild)
        env:
          IMAGE_REF: ${{ steps.pin.outputs.image_ref }}
        run: docker buildx imagetools inspect "$IMAGE_REF"

  # VM09 production deployment is opt-in until host SSH credentials are configured.
  deploy_production:
    needs: promote
    if: >-
      ${{ needs.promote.outputs.image_ref != '' &&
          vars.EVENTGRAPH_PROD_AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: eventgraph-prod-rollout
      cancel-in-progress: false
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy pinned image on VM09
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ vars.EVENTGRAPH_PROD_HOST }}
          username: ${{ vars.EVENTGRAPH_PROD_USER }}
          key: ${{ secrets.EVENTGRAPH_PROD_SSH_KEY }}
          fingerprint: ${{ secrets.EVENTGRAPH_PROD_SSH_FINGERPRINT }}
          envs: GHCR_TOKEN,GHCR_USER
          command_timeout: 13m
          version: '1.8.2'
          script: |
            cd /home/ubuntu/livingruntime-prod-source
            bash scripts/deploy-prod.sh

  deploy_development:
    needs: publish
    concurrency:
      group: eventgraph-dev-rollout
      cancel-in-progress: false
    if: >-
      ${{ needs.publish.outputs.image_ref != '' &&
          github.ref_name == 'develop' &&
          vars.EVENTGRAPH_DEV_AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.source_sha }}
          persist-credentials: false
      - name: Skip stale release
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.publish.outputs.source_sha }}
        run: |
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/branches/develop" --jq '.commit.sha')" == "$SOURCE_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Pull image and restart development app
        if: steps.current.outputs.deploy == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          EVENTGRAPH_IMAGE: ${{ needs.publish.outputs.image_ref }}
          EVENTGRAPH_DIR: ${{ vars.EVENTGRAPH_DEV_ROOT || '/home/ubuntu/livingruntime-aihot' }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ vars.EVENTGRAPH_DEV_HOST }}
          username: ${{ vars.EVENTGRAPH_DEV_USER }}
          key: ${{ secrets.EVENTGRAPH_DEV_SSH_KEY }}
          fingerprint: ${{ secrets.EVENTGRAPH_DEV_SSH_FINGERPRINT }}
          envs: EVENTGRAPH_IMAGE,EVENTGRAPH_DIR,GHCR_USER,GHCR_TOKEN
          command_timeout: 15m
          version: '1.8.2'
          script_path: scripts/ci/deploy-image.sh
