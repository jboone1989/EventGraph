# Permanent merged-branch housekeeping plus one explicit initial cleanup.
# Open/unmerged work is backed up as Git tags BEFORE a branch is deleted.
name: Branch hygiene

on:
  push:
    branches: [develop]
    paths: ['.github/workflows/branch-hygiene.yml']
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: eventgraph-branch-hygiene
  cancel-in-progress: false

jobs:
  initial_clean:
    if: >-
      ${{ github.repository == 'jboone1989/EventGraph' &&
          github.event_name == 'push' &&
          github.event.head_commit.message == 'maintenance: archive and prune EventGraph branches' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
      - name: Archive unmerged commits, close PRs, delete obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --no-tags origin main develop
          mapfile -t branches < <(gh api --paginate "repos/$GH_REPO/branches?per_page=100" --jq '.[].name')
          deleted=0
          archived=0
          failed=0
          for branch in "${branches[@]}"; do
            case "$branch" in main|develop) continue ;; esac
            echo "::group::Archive and prune $branch"
            sha="$(gh api "repos/$GH_REPO/branches/$branch" --jq '.commit.sha')"
            if ! git merge-base --is-ancestor "$sha" origin/main &&
               ! git merge-base --is-ancestor "$sha" origin/develop; then
              tag="archive/pre-cleanup-20261019/$branch"
              if ! gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha' >/dev/null 2>&1; then
                gh api -X POST "repos/$GH_REPO/git/refs" \
                  -f "ref=refs/tags/$tag" -f "sha=$sha" >/dev/null
              fi
              saved="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')"
              if [[ "$saved" != "$sha" ]]; then
                echo "::error::Archive mismatch for $branch: $saved != $sha"
                failed=$((failed+1))
                echo "::endgroup::"
                continue
              fi
              archived=$((archived+1))
              echo "Archived at $tag ($sha)"
            fi
            # Closing the old PR preserves its discussion and avoids dangling reviews.
            blocked=0
            while IFS= read -r pr; do
              [[ -n "$pr" ]] || continue
              if ! gh pr close "$pr" --comment \
                  "Branch cleanup requested by the repository owner. Unmerged branch tip preserved at \`archive/pre-cleanup-20261019/$branch\` if not contained in main/develop; original commit: $sha. Reopen work from the tag if needed."; then
                echo "::error::Failed to close PR #$pr for $branch"
                blocked=1
              fi
            done < <(gh pr list --state open --head "$branch" --json number --jq '.[].number')
            if ((blocked)); then
              failed=$((failed+1))
              echo "::endgroup::"
              continue
            fi
            current="$(gh api "repos/$GH_REPO/branches/$branch" --jq '.commit.sha')"
            if [[ "$current" != "$sha" ]]; then
              echo "::error::Branch moved during cleanup; refuse deletion $branch"
              failed=$((failed+1))
              echo "::endgroup::"
              continue
            fi
            if gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch" >/dev/null; then
              deleted=$((deleted+1))
              echo "Deleted $branch"
            else
              echo "::error::Failed to delete $branch"
              failed=$((failed+1))
            fi
            echo "::endgroup::"
          done
          mapfile -t remaining < <(gh api --paginate "repos/$GH_REPO/branches?per_page=100" --jq '.[].name' | grep -v -e '^main$' -e '^develop$' || true)
          echo "Deleted=$deleted Archived=$archived Failed=$failed Remaining=${#remaining[@]}"
          printf 'Remaining: %s\n' "${remaining[@]}"
          [[ "$failed" -eq 0 && "${#remaining[@]}" -eq 0 ]]

  prune_merged:
    if: >-
      ${{ github.repository == 'jboone1989/EventGraph' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.merged == true &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.base.ref == 'develop' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete short-lived merged branch, unless another PR depends on it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          case "$HEAD_BRANCH" in main|develop) exit 0 ;; esac
          # Do not delete stacked PR bases or branches with other open PRs.
          test "$(gh pr list --state open --base "$HEAD_BRANCH" --json number --jq length)" = 0 || exit 0
          test "$(gh pr list --state open --head "$HEAD_BRANCH" --json number --jq length)" = 0 || exit 0
          if ! gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$HEAD_BRANCH"; then
            if gh api "repos/$GH_REPO/git/ref/heads/$HEAD_BRANCH" >/dev/null 2>&1; then
              echo "::error::Could not delete merged branch $HEAD_BRANCH"
              exit 1
            fi
          fi
