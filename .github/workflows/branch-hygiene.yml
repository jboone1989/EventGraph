# Only prune merged feature branches; never run destructive initial cleanup.
# Open/unmerged work is backed up as Git tags BEFORE a branch is deleted.
name: Branch hygiene

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: eventgraph-branch-hygiene
  cancel-in-progress: false

jobs:
  prune_merged:
    if: >-
      ${{ github.repository == 'jboone1989/EventGraph' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.merged == true &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.base.ref == 'develop' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete short-lived merged branch, unless another PR depends on it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          case "$HEAD_BRANCH" in main|develop) exit 0 ;; esac
          # Do not delete stacked PR bases or branches with other open PRs.
          test "$(gh pr list --state open --base "$HEAD_BRANCH" --json number --jq length)" = 0 || exit 0
          test "$(gh pr list --state open --head "$HEAD_BRANCH" --json number --jq length)" = 0 || exit 0
          if ! gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$HEAD_BRANCH"; then
            if gh api "repos/$GH_REPO/git/ref/heads/$HEAD_BRANCH" >/dev/null 2>&1; then
              echo "::error::Could not delete merged branch $HEAD_BRANCH"
              exit 1
            fi
          fi
